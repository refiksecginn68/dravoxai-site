<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teşekkürler | Dravox AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; background-color: #050508; color: #fff;
      font-family: 'Inter', sans-serif; display: flex; align-items: center;
      justify-content: center; height: 100vh; text-align: center;
    }
    .container {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
      padding: 50px 40px; border-radius: 24px; max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,212,255,0.05);
    }
    h1 { font-size: 2rem; margin-bottom: 15px; background: linear-gradient(135deg, #00D4FF, #A855F7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94A3B8; line-height: 1.6; margin-bottom: 30px; }
    .btn {
      display: inline-block; padding: 14px 28px; background: linear-gradient(135deg, #00D4FF, #A855F7);
      color: #050508; text-decoration: none; font-weight: 600; border-radius: 12px;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
    <h1>Talebiniz Alındı!</h1>
    <p>Mesajınız bize başarıyla ulaştı. Dravox AI ekibi olarak projenizi inceleyip 24 saat içinde size dönüş yapacağız.</p>
    <a href="/" class="btn">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
